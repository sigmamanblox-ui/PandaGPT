services:
  - type: web
    name: pandagpt-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5.5
      - key: AI_NAME
        value: PandaGPT
      - key: CORS_ORIGINS
        sync: false
